[package]
name = "chungusite"
version = "0.1.0"
edition = "2021"
description = "x86_64 to Rust decompiler"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
cpp_demangle = "0.5.1"
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "instr_info"] }
memmap2 = "0.9.11"
object = { version = "0.40.0", default-features = false, features = ["read_core", "elf", "macho", "pe", "coff", "std"] }
# ML refinement (names/types). load-dynamic: libonnxruntime is loaded at runtime from
# ORT_DYLIB_PATH, so the build downloads nothing. ort is pinned: its 2.0 RCs change API.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-24"], optional = true }
rayon = "1.12.0"
rustc-demangle = "0.1.28"
tokenizers = { version = "0.23", default-features = false, features = ["onig"], optional = true }

[features]
ml = ["dep:ort", "dep:tokenizers"]

[dev-dependencies]
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "instr_info", "code_asm"] }
object = { version = "0.40.0", default-features = false, features = ["write_core", "elf", "std"] }

[[example]]
name = "refine"
required-features = ["ml"]

[[test]]
name = "refine_exact"
required-features = ["ml"]

[[test]]
name = "refine_ort"
required-features = ["ml"]

[profile.release]
lto = "thin"
codegen-units = 1
