[package]
name = "chungusite"
version = "0.1.0"
edition = "2021"
description = "x86_64 to Rust decompiler"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
cpp_demangle = "0.5.1"
datafrog = "2"
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "instr_info", "intel"] }
# DWARF: parameter and struct types when the binary has debug info (types.rs).
gimli = { version = "0.33", default-features = false, features = ["read", "std"] }
memmap2 = "0.9.11"
object = { version = "0.40.0", default-features = false, features = ["read_core", "elf", "macho", "pe", "coff", "std"] }
# ML refinement (names/types). load-dynamic: libonnxruntime is loaded at runtime from
# ORT_DYLIB_PATH, so the build downloads nothing. ort is pinned: its 2.0 RCs change API.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-24"], optional = true }
rayon = "1.12.0"
rustc-demangle = "0.1.28"
# --refine: the type model's labels from config.json.
serde_json = { version = "1", optional = true }
tokenizers = { version = "0.23", default-features = false, features = ["onig"], optional = true }

[features]
ml = ["dep:ort", "dep:tokenizers", "dep:serde_json"]

[dev-dependencies]
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "instr_info", "intel", "code_asm"] }
object = { version = "0.40.0", default-features = false, features = ["write_core", "elf", "std"] }

[[example]]
name = "refine"
required-features = ["ml"]

[[test]]
name = "refine_exact"
required-features = ["ml"]

[[test]]
name = "refine_ort"
required-features = ["ml"]

[[test]]
name = "refine_model"
required-features = ["ml"]

[profile.release]
lto = "thin"
codegen-units = 1

# iced-x86 subtracts pointers truncated to u32 (`decode_out_ptr`), which
# overflows when the bytes it decodes straddle a 4 GiB address boundary: a
# panic in debug builds only, depending on where the binary's bytes land.
[profile.dev.package.iced-x86]
overflow-checks = false
